name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment configuration
        id: config
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALPACA_KEY: ${{ secrets.APCA_API_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.APCA_API_SECRET_KEY }}
          ACCESS_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          if grep -q 'CREATE_D1_DATABASE_AND_REPLACE_ID' wrangler.jsonc; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment is waiting for the D1 database ID in wrangler.jsonc.'
            exit 0
          fi
          for name in CF_TOKEN CF_ACCOUNT ALPACA_KEY ALPACA_SECRET ACCESS_DOMAIN ACCESS_AUD; do
            if [ -z "${!name}" ]; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo "Deployment is waiting for GitHub secret: $name"
              exit 0
            fi
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Apply D1 migrations
        if: steps.config.outputs.ready == 'true'
        run: npx wrangler@4 d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload Alpaca and Access secrets
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          set -euo pipefail
          for name in APCA_API_KEY_ID APCA_API_SECRET_KEY ACCESS_TEAM_DOMAIN ACCESS_AUD; do
            printf '%s' "${!name}" | npx wrangler@4 secret put "$name"
          done
      - name: Deploy Worker and dashboard
        if: steps.config.outputs.ready == 'true'
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
