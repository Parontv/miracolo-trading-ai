name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment configuration
        id: config
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          for name in CF_TOKEN CF_ACCOUNT D1_ID; do
            if [ -z "${!name}" ]; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo "Waiting for GitHub secret: $name"
              {
                echo "## Miracolo deployment in attesa"
                echo "Il deploy non è partito perché manca il secret: $name."
                echo "Aggiungi i tre valori richiesti nella pagina GitHub Settings > Secrets and variables > Actions."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          if ! [[ "$D1_ID" =~ ^([a-fA-F0-9]{32}|[a-fA-F0-9-]{36})$ ]]; then
            echo 'Invalid D1_DATABASE_ID format.'
            exit 1
          fi
          sed -i "s/CREATE_D1_DATABASE_AND_REPLACE_ID/$D1_ID/" wrangler.jsonc
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "## Configurazione Cloudflare presente" >> "$GITHUB_STEP_SUMMARY"
          echo "Procedo con migrazioni D1 e deploy Worker." >> "$GITHUB_STEP_SUMMARY"
      - name: Apply D1 migrations
        if: steps.config.outputs.ready == 'true'
        run: npx wrangler@4 d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload optional Alpaca and Access secrets
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          set -euo pipefail
          for name in APCA_API_KEY_ID APCA_API_SECRET_KEY ACCESS_TEAM_DOMAIN ACCESS_AUD; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler@4 secret put "$name"
            fi
          done
      - name: Deploy Worker and dashboard
        if: steps.config.outputs.ready == 'true'
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
