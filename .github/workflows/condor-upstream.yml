name: Validate Condor upstream

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  condor-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned upstream Condor commit
        run: |
          test -d upstream/condor
          test "$(git -C upstream/condor rev-parse HEAD)" = "2442752df1259651002034055a32d974da29a361"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile original Condor Python sources
        working-directory: upstream/condor
        run: python -m compileall -q .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstream/condor/frontend/package-lock.json
      - name: Install original Condor frontend dependencies
        working-directory: upstream/condor/frontend
        run: npm ci
      - name: Build original Condor dashboard
        working-directory: upstream/condor/frontend
        run: npm run build
      - name: Run original Condor frontend tests
        working-directory: upstream/condor/frontend
        run: npm test -- --reporter=dot

  windows-access-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/condor-tailnet-serve.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
