name: Validate Miracolo

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  web-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - name: Verify dashboard does not contain a local trading simulator
        run: |
          ! grep -R -E 'browser-bot|binance\.vision|localStorage.*paper' web/
          grep -q 'api/health' web/app.js
          grep -q 'Alpaca' web/index.html
