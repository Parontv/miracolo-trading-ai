name: Validate
on:
  pull_request:
  push:
    branches: [main, integration/condor-foundation]

jobs:
  miracolo-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Verify pinned Condor source
        run: |
          test -f upstream/condor/pyproject.toml
          test -f upstream/condor/frontend/package.json
          grep -q 'requires-python = ">=3.12,<3.14"' upstream/condor/pyproject.toml

  condor-frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upstream/condor/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstream/condor/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  condor-backend-import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upstream/condor
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync
      - name: Verify backend imports
        run: |
          uv run python -c "import config_manager; import handlers; import utils; print('Condor backend imports OK')"
