services:
  miracolo-api:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    container_name: miracolo-api
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env.runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  miracolo-web:
    image: caddy:2.10-alpine
    container_name: miracolo-web
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env.runtime
    volumes:
      - ./Caddyfile.runtime:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
