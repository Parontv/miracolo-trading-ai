services:
  miracolo-api:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    container_name: miracolo-api
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env.runtime
    environment:
      MIRACOLO_STATE_DB: /data/miracolo.sqlite3
    volumes:
      - miracolo-state:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  miracolo-worker:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    container_name: miracolo-worker
    command: ["python", "-m", "miracolo_trading.worker"]
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env.runtime
    environment:
      MIRACOLO_STATE_DB: /data/miracolo.sqlite3
      MIRACOLO_POLL_SECONDS: "60"
    volumes:
      - miracolo-state:/data
    depends_on:
      miracolo-api:
        condition: service_started

  miracolo-web:
    image: caddy:2.10-alpine
    container_name: miracolo-web
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env.runtime
    volumes:
      - ./Caddyfile.runtime:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro

  # Outbound-only tunnel: no public inbound port is opened on the host.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: miracolo-cloudflared
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env.runtime
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      miracolo-web:
        condition: service_started

volumes:
  miracolo-state:
